<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <g stroke="#5a5045" stroke-linecap="round" fill="none">
    <!-- Level 0: Ж at center (32,32), len=20, axis=vertical, branch angle=35° -->
    <!-- sin(35°)=0.574, cos(35°)=0.819 -->
    <!-- Vertical (no recursion) -->
    <line x1="32" y1="32" x2="32" y2="12" stroke-width="3" opacity="0.5"/>
    <line x1="32" y1="32" x2="32" y2="52" stroke-width="3" opacity="0.5"/>
    <!-- 4 diagonals at ±35° from vertical -->
    <line x1="32" y1="32" x2="20.5" y2="15.6" stroke-width="3" opacity="0.5"/>
    <line x1="32" y1="32" x2="43.5" y2="15.6" stroke-width="3" opacity="0.5"/>
    <line x1="32" y1="32" x2="20.5" y2="48.4" stroke-width="3" opacity="0.5"/>
    <line x1="32" y1="32" x2="43.5" y2="48.4" stroke-width="3" opacity="0.5"/>

    <!-- Level 1 from upper-left (20.5, 15.6), axis=-35°, len=7 -->
    <!-- sin(-35°)=-0.574, cos(-35°)=0.819 -->
    <!-- Vertical along -35° axis -->
    <line x1="20.5" y1="15.6" x2="16.5" y2="9.9" stroke-width="1.5" opacity="0.28"/>
    <line x1="20.5" y1="15.6" x2="24.5" y2="21.3" stroke-width="1.5" opacity="0.28"/>
    <!-- Diagonals at ±35° from -35° axis = -70° and 0° and -35°+180°±35° -->
    <line x1="20.5" y1="15.6" x2="13.9" y2="13.2" stroke-width="1.5" opacity="0.28"/>
    <line x1="20.5" y1="15.6" x2="20.5" y2="8.6" stroke-width="1.5" opacity="0.28"/>
    <line x1="20.5" y1="15.6" x2="20.5" y2="22.6" stroke-width="1.5" opacity="0.28"/>
    <line x1="20.5" y1="15.6" x2="27.1" y2="18.0" stroke-width="1.5" opacity="0.28"/>

    <!-- Level 1 from upper-right (43.5, 15.6), axis=+35° -->
    <line x1="43.5" y1="15.6" x2="47.5" y2="9.9" stroke-width="1.5" opacity="0.28"/>
    <line x1="43.5" y1="15.6" x2="39.5" y2="21.3" stroke-width="1.5" opacity="0.28"/>
    <line x1="43.5" y1="15.6" x2="50.1" y2="13.2" stroke-width="1.5" opacity="0.28"/>
    <line x1="43.5" y1="15.6" x2="43.5" y2="8.6" stroke-width="1.5" opacity="0.28"/>
    <line x1="43.5" y1="15.6" x2="43.5" y2="22.6" stroke-width="1.5" opacity="0.28"/>
    <line x1="43.5" y1="15.6" x2="36.9" y2="18.0" stroke-width="1.5" opacity="0.28"/>

    <!-- Level 1 from lower-left (20.5, 48.4), axis=180°-35°=145° -->
    <line x1="20.5" y1="48.4" x2="16.5" y2="54.1" stroke-width="1.5" opacity="0.28"/>
    <line x1="20.5" y1="48.4" x2="24.5" y2="42.7" stroke-width="1.5" opacity="0.28"/>
    <line x1="20.5" y1="48.4" x2="13.9" y2="50.8" stroke-width="1.5" opacity="0.28"/>
    <line x1="20.5" y1="48.4" x2="20.5" y2="55.4" stroke-width="1.5" opacity="0.28"/>
    <line x1="20.5" y1="48.4" x2="20.5" y2="41.4" stroke-width="1.5" opacity="0.28"/>
    <line x1="20.5" y1="48.4" x2="27.1" y2="46.0" stroke-width="1.5" opacity="0.28"/>

    <!-- Level 1 from lower-right (43.5, 48.4), axis=180°+35°=215° -->
    <line x1="43.5" y1="48.4" x2="47.5" y2="54.1" stroke-width="1.5" opacity="0.28"/>
    <line x1="43.5" y1="48.4" x2="39.5" y2="42.7" stroke-width="1.5" opacity="0.28"/>
    <line x1="43.5" y1="48.4" x2="50.1" y2="50.8" stroke-width="1.5" opacity="0.28"/>
    <line x1="43.5" y1="48.4" x2="43.5" y2="55.4" stroke-width="1.5" opacity="0.28"/>
    <line x1="43.5" y1="48.4" x2="43.5" y2="41.4" stroke-width="1.5" opacity="0.28"/>
    <line x1="43.5" y1="48.4" x2="36.9" y2="46.0" stroke-width="1.5" opacity="0.28"/>
  </g>
</svg>
